name: Deriv check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node -e "import('./scanner/deriv.mjs').then(async m=>{for(const s of ['V75','BOOM1000','CRASH500','STEP','V75(1S)']){try{const b=await m.derivCandles(m.synthCode(s),3600,50);console.log(s,m.synthCode(s),b.length,'last close',b[b.length-1].c,new Date(b[b.length-1].t).toISOString())}catch(e){console.log(s,'ERR',e.message)}}})"
